name: Publish T2 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-t2-image.yml"
      - "core/**"
      - "tracks/t2_agenthon/**"
      - "packaging/t2/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agenthon-t2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/t2/Dockerfile
          platforms: linux/amd64
          push: true
          # CI tags the commit only. A version tag asserts "this digest passed the gates",
          # which CI cannot know: it is applied by hand after build/test/smoke and the
          # admissibility matrix run against that exact digest. A push to main once moved
          # :v0.3.0 onto an unverified CI build; this is the fix.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
