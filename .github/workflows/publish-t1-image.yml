name: Publish T1 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-t1-image.yml"
      - "core/**"
      - "tracks/t1_agenthon/**"
      - "packaging/t1/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agenthon-t1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/t1/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v0.2.0
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: false
          sbom: false
