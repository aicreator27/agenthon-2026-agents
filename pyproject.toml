[project]
name = "agenthon-2026-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
dev = ["ruff==0.4.7", "mypy==1.19.1"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["core/src", "tracks/t2_agenthon/src"]
testpaths = ["tests"]

